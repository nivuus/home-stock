add_stock:
  name: Ajouter au stock
  description: Crée un lot et son mouvement d'achat.
  fields:
    article_id:
      name: Article
      description: Identifiant de l'article. Alternative au code-barres.
      selector: { number: { min: 1, mode: box } }
    barcode:
      name: Code-barres
      description: EAN d'un article déjà connu. Alternative à l'identifiant.
      selector: { text: }
    quantity:
      name: Quantité
      description: Dans l'unité de base du produit, ou en conditionnements.
      required: true
      selector: { number: { min: 0, step: 0.001, mode: box } }
    location_id:
      name: Emplacement
      required: true
      selector: { number: { min: 1, mode: box } }
    best_before:
      name: Date limite
      selector: { date: }
    price_per_base_unit:
      name: Prix par unité de base
      description: En euros. 0,004 €/g pour un paquet de 500 g à 2 €.
      selector: { number: { min: 0, step: any, mode: box } }
    packaging_base_quantity:
      name: Taille du conditionnement
      description: Si la quantité est en paquets, le nombre d'unités de base par paquet.
      selector: { number: { min: 0, step: 0.001, mode: box } }
    idempotency_key:
      name: Clé d'idempotence
      description: Rejouer l'appel avec la même clé n'écrit rien de nouveau.
      selector: { text: }

consume:
  name: Consommer
  description: Sort une quantité du stock, en traversant les lots du plus urgent au moins urgent.
  fields:
    product_id:
      name: Produit
      required: true
      selector: { number: { min: 1, mode: box } }
    quantity:
      name: Quantité
      required: true
      selector: { number: { min: 0, step: 0.001, mode: box } }
    reason:
      name: Motif
      default: consumption
      selector:
        select:
          options:
            - { value: consumption, label: Consommé }
            - { value: waste, label: Jeté }
            - { value: expired, label: Périmé }
    batch_id:
      name: Lot
      description: Prendre dans ce lot précis plutôt que de suivre l'ordre FIFO.
      selector: { number: { min: 1, mode: box } }
    parts_total:
      name: Parts servies
      description: Nombre d'assiettes servies au total. À donner avec « parts mangées ».
      selector: { number: { min: 1, max: 24, mode: box } }
    parts_mine:
      name: Parts mangées
      description: Combien de ces assiettes sont les tiennes. Zéro est valide.
      selector: { number: { min: 0, max: 24, mode: box } }
    idempotency_key:
      name: Clé d'idempotence
      selector: { text: }

open_batch:
  name: Ouvrir un lot
  description: >-
    Marque un lot comme entamé. Si le produit a une durée après ouverture, la date
    limite est avancée. Rien n'est consommé.
  fields:
    batch_id:
      name: Lot
      required: true
      selector: { number: { min: 1, mode: box } }

transfer_batch:
  name: Déplacer un lot
  description: Change l'emplacement d'un lot, par exemple du congélateur au frigo.
  fields:
    batch_id:
      name: Lot
      required: true
      selector: { number: { min: 1, mode: box } }
    location_id:
      name: Emplacement d'arrivée
      required: true
      selector: { number: { min: 1, mode: box } }

adjust_inventory:
  name: Corriger l'inventaire
  description: >-
    Enregistre la quantité réellement comptée pour un article à un emplacement.
    L'écart est journalisé comme correction : il ne compte ni en kilocalories ni en euros.
  fields:
    article_id:
      name: Article
      required: true
      selector: { number: { min: 1, mode: box } }
    location_id:
      name: Emplacement
      required: true
      selector: { number: { min: 1, mode: box } }
    counted_quantity:
      name: Quantité comptée
      description: Dans l'unité de base du produit.
      required: true
      selector: { number: { min: 0, step: 0.001, mode: box } }

query_stock:
  name: Interroger le stock
  description: Renvoie ce qui est en stock, agrégé par produit. Ne modifie rien.
  fields:
    name:
      name: Filtre sur le nom
      description: Fragment de nom, sans tenir compte de la casse ni des accents.
      selector: { text: }

export_journal:
  name: Exporter le journal
  description: >-
    Renvoie tous les mouvements. Le journal étant en ajout seul, il suffit à
    reconstruire l'état du stock.

import_grocy_catalog:
  name: Importer le catalogue Grocy
  description: >-
    Copie les produits, emplacements, groupes, codes-barres et calories depuis une
    copie de grocy.db placée dans le dossier de configuration. Simulation par défaut.
  fields:
    path:
      name: Fichier
      description: Chemin relatif au dossier de configuration.
      default: grocy_import.db
      selector: { text: }
    apply:
      name: Appliquer
      description: Sans cela, rien n'est écrit — seul le rapport est produit.
      default: false
      selector: { boolean: }

resync_off:
  name: Resynchroniser Open Food Facts
  description: >-
    Relit un article, tout un produit ou tout le catalogue depuis Open Food Facts.
    S'exécute en tâche de fond (environ 40 minutes pour tout le catalogue) : les
    champs corrigés à la main ne sont jamais écrasés.
  fields:
    article_id:
      name: Article
      description: Ne resynchronise que cet article.
      selector: { number: { min: 1, mode: box } }
    product_id:
      name: Produit
      description: Resynchronise tous les articles de ce produit.
      selector: { number: { min: 1, mode: box } }
    all:
      name: Tout le catalogue
      description: >-
        Resynchronise tous les articles ayant un code-barres. Laisser vide pour
        cibler un article ou un produit précis à la place.
      selector: { boolean: }

maintenance_plan:
  name: Plan de maintenance
  description: >-
    Rend les tâches d'entretien liées aux piles, fusionnées avec celles que le
    macro `maintenance.jinja` a déjà calculées. Personne n'appelle ce service à
    la main : il est appelé par l'automation « Maintenance - Synchronisation
    liste de tâches » (maintenance_sync_taches), qui s'en sert pour reconstruire
    todo.maintenance chaque heure. La réponse porte `items`, `keep` et
    `complete` — et c'est `complete` qui autorise ou non la fermeture des
    tâches : un plan incomplet a le droit d'ajouter et de rafraîchir, jamais de
    fermer.
  fields:
    extra_items:
      name: Tâches du macro
      description: >-
        Les items déjà calculés par le macro (aspirateurs, filtres, plantes,
        mises à jour). Recopiés tels quels, même ceux dont la forme n'est pas
        comprise : le service ne doit jamais pouvoir faire disparaître une tâche.
      required: false
      example: "{{ plan['items'] }}"
      selector:
        object:
    extra_keep:
      name: Résumés à maintenir
      description: >-
        Les résumés que le macro veut garder ouverts (son hystérésis). Réunis
        avec ceux des piles, sans doublon.
      required: false
      example: "{{ plan['keep'] }}"
      selector:
        object:

record_battery_event:
  name: Enregistrer un événement de pile
  description: >-
    Note qu'une pile vient d'être changée, rechargée, posée ou retirée. Un
    remplacement sort une rechange du placard quand la pile en a une, et remet
    à zéro le dernier relevé : on ne sait rien de la pile neuve tant que
    l'appareil n'a pas parlé.
  fields:
    battery_id:
      name: Pile
      description: Identifiant de la pile déclarée.
      required: true
      example: 7
      selector:
        number:
          min: 1
          mode: box
    kind:
      name: Nature de l'événement
      description: >-
        `replacement` (pile changée), `charge` (rechargée), `install` (posée
        pour la première fois) ou `removal` (retirée). Une pile jetable ne se
        recharge pas, une batterie intégrée ne se remplace pas.
      required: true
      example: replacement
      selector:
        select:
          options:
            - install
            - charge
            - replacement
            - removal
    occurred_at:
      name: Moment
      description: Horodatage ISO. Par défaut, maintenant.
      required: false
      example: "2026-08-21T10:00:00"
      selector:
        text:
    consume_spare:
      name: Sortir une rechange du placard
      description: >-
        Par défaut, une pile jetable en consomme une et une cellule
        rechargeable n'en consomme aucune — les quatre LADDA tournent entre le
        tiroir et trois capteurs, et compter chaque rotation viderait le stock
        pour rien. À forcer le jour où une cellule meurt vraiment.
      required: false
      example: true
      selector:
        boolean:
    note:
      name: Note
      description: Commentaire libre attaché à l'événement.
      required: false
      example: "achetée en lot de 4"
      selector:
        text:
    idempotency_key:
      name: Clé d'idempotence
      description: >-
        Rejouer la même clé ne réécrit ni l'événement ni la sortie de stock.
      required: false
      example: "b7e1-…"
      selector:
        text:

import_grocy_equipment:
  name: Importer les piles et équipements Grocy
  description: >-
    Reprend les piles, leurs rechanges et les équipements depuis une COPIE de
    grocy.db, puis balaye le registre pour proposer une décision sur chaque
    capteur de pile. Sans `apply`, rien n'est écrit : le rapport est rendu tel
    qu'un vrai passage le rendrait. À lire avant d'appliquer : `summary_diff`
    doit être vide et `ok` doit être vrai, sinon la bascule fermerait des
    tâches et en rouvrirait d'autres.
  fields:
    database_path:
      name: Chemin de la base Grocy
      description: >-
        Chemin d'une COPIE de grocy.db, lisible par Home Assistant. Jamais la
        base de production : l'import ne l'ouvre qu'en lecture seule, mais la
        copie reste la règle.
      required: true
      example: /config/grocy-copie.db
      selector:
        text:
    apply:
      name: Appliquer
      description: >-
        Faux par défaut. Vrai écrit réellement les produits, les piles et les
        équipements.
      required: false
      default: false
      selector:
        boolean:
