add_stock:
  name: Ajouter au stock
  description: Crée un lot et son mouvement d'achat.
  fields:
    article_id:
      name: Article
      description: Identifiant de l'article. Alternative au code-barres.
      selector: { number: { min: 1, mode: box } }
    barcode:
      name: Code-barres
      description: EAN d'un article déjà connu. Alternative à l'identifiant.
      selector: { text: }
    quantity:
      name: Quantité
      description: Dans l'unité de base du produit, ou en conditionnements.
      required: true
      selector: { number: { min: 0, step: 0.001, mode: box } }
    location_id:
      name: Emplacement
      required: true
      selector: { number: { min: 1, mode: box } }
    best_before:
      name: Date limite
      selector: { date: }
    price_per_base_unit:
      name: Prix par unité de base
      description: En euros. 0,004 €/g pour un paquet de 500 g à 2 €.
      selector: { number: { min: 0, step: any, mode: box } }
    packaging_base_quantity:
      name: Taille du conditionnement
      description: Si la quantité est en paquets, le nombre d'unités de base par paquet.
      selector: { number: { min: 0, step: 0.001, mode: box } }
    idempotency_key:
      name: Clé d'idempotence
      description: Rejouer l'appel avec la même clé n'écrit rien de nouveau.
      selector: { text: }

consume:
  name: Consommer
  description: Sort une quantité du stock, en traversant les lots du plus urgent au moins urgent.
  fields:
    product_id:
      name: Produit
      required: true
      selector: { number: { min: 1, mode: box } }
    quantity:
      name: Quantité
      required: true
      selector: { number: { min: 0, step: 0.001, mode: box } }
    reason:
      name: Motif
      default: consumption
      selector:
        select:
          options:
            - { value: consumption, label: Consommé }
            - { value: waste, label: Jeté }
            - { value: expired, label: Périmé }
    batch_id:
      name: Lot
      description: Prendre dans ce lot précis plutôt que de suivre l'ordre FIFO.
      selector: { number: { min: 1, mode: box } }
    parts_total:
      name: Parts servies
      description: Nombre d'assiettes servies au total. À donner avec « parts mangées ».
      selector: { number: { min: 1, max: 24, mode: box } }
    parts_mine:
      name: Parts mangées
      description: Combien de ces assiettes sont les tiennes. Zéro est valide.
      selector: { number: { min: 0, max: 24, mode: box } }
    idempotency_key:
      name: Clé d'idempotence
      selector: { text: }

open_batch:
  name: Ouvrir un lot
  description: >-
    Marque un lot comme entamé. Si le produit a une durée après ouverture, la date
    limite est avancée. Rien n'est consommé.
  fields:
    batch_id:
      name: Lot
      required: true
      selector: { number: { min: 1, mode: box } }

transfer_batch:
  name: Déplacer un lot
  description: Change l'emplacement d'un lot, par exemple du congélateur au frigo.
  fields:
    batch_id:
      name: Lot
      required: true
      selector: { number: { min: 1, mode: box } }
    location_id:
      name: Emplacement d'arrivée
      required: true
      selector: { number: { min: 1, mode: box } }

adjust_inventory:
  name: Corriger l'inventaire
  description: >-
    Enregistre la quantité réellement comptée pour un article à un emplacement.
    L'écart est journalisé comme correction : il ne compte ni en kilocalories ni en euros.
  fields:
    article_id:
      name: Article
      required: true
      selector: { number: { min: 1, mode: box } }
    location_id:
      name: Emplacement
      required: true
      selector: { number: { min: 1, mode: box } }
    counted_quantity:
      name: Quantité comptée
      description: Dans l'unité de base du produit.
      required: true
      selector: { number: { min: 0, step: 0.001, mode: box } }

query_stock:
  name: Interroger le stock
  description: Renvoie ce qui est en stock, agrégé par produit. Ne modifie rien.
  fields:
    name:
      name: Filtre sur le nom
      description: Fragment de nom, sans tenir compte de la casse ni des accents.
      selector: { text: }

export_journal:
  name: Exporter le journal
  description: >-
    Renvoie tous les mouvements. Le journal étant en ajout seul, il suffit à
    reconstruire l'état du stock.

import_grocy_catalog:
  name: Importer le catalogue Grocy
  description: >-
    Copie les produits, emplacements, groupes, codes-barres et calories depuis une
    copie de grocy.db placée dans le dossier de configuration. Simulation par défaut.
  fields:
    path:
      name: Fichier
      description: Chemin relatif au dossier de configuration.
      default: grocy_import.db
      selector: { text: }
    apply:
      name: Appliquer
      description: Sans cela, rien n'est écrit — seul le rapport est produit.
      default: false
      selector: { boolean: }

resync_off:
  name: Resynchroniser Open Food Facts
  description: >-
    Relit un article, tout un produit ou tout le catalogue depuis Open Food Facts.
    S'exécute en tâche de fond (environ 40 minutes pour tout le catalogue) : les
    champs corrigés à la main ne sont jamais écrasés.
  fields:
    article_id:
      name: Article
      description: Ne resynchronise que cet article.
      selector: { number: { min: 1, mode: box } }
    product_id:
      name: Produit
      description: Resynchronise tous les articles de ce produit.
      selector: { number: { min: 1, mode: box } }
    all:
      name: Tout le catalogue
      description: >-
        Resynchronise tous les articles ayant un code-barres. Laisser vide pour
        cibler un article ou un produit précis à la place.
      selector: { boolean: }

plan_meal:
  name: Poser un repas
  description: >-
    Place une recette, un produit ou une simple note sur un jour et un créneau.
    Le jour est une journée alimentaire : elle court de 4 h à 4 h.
  fields:
    day:
      name: Jour
      description: Journée alimentaire, au format AAAA-MM-JJ.
      required: true
      selector: { text: }
    slot_key:
      name: Créneau
      required: true
      selector:
        select:
          options:
            - { value: breakfast, label: Petit-déjeuner }
            - { value: lunch, label: Déjeuner }
            - { value: dinner, label: Dîner }
            - { value: snack, label: En-cas }
    recipe_id:
      name: Recette
      description: L'une des trois natures possibles — jamais deux à la fois.
      selector: { number: { min: 1, mode: box } }
    product_id:
      name: Produit
      description: Un repas qui est simplement un produit, par exemple un yaourt.
      selector: { number: { min: 1, mode: box } }
    amount:
      name: Quantité
      description: Pour un repas « produit », dans l'unité de base du produit.
      selector: { number: { min: 0, step: 0.01, mode: box } }
    note:
      name: Note
      description: Un repas libre, par exemple « Restaurant avec Anne ».
      selector: { text: }
    servings:
      name: Nombre de parts
      description: >-
        Combien de parts on prépare. La recette est mise à l'échelle depuis les
        siennes.
      default: 1
      selector: { number: { min: 0.25, step: 0.25, mode: box } }

validate_meal:
  name: Valider un repas
  description: >-
    Cuisine puis mange, en une seule transaction : les ingrédients sortent, le
    plat entre en stock avec sa date limite, la part mangée est comptée.
    SIMULE par défaut — décochez pour écrire réellement. La validation n'est pas
    annulable.
  fields:
    meal_id:
      name: Repas
      required: true
      selector: { number: { min: 1, mode: box } }
    portions_eaten:
      name: Parts mangées
      description: "Zéro est valide : on cuisine parfois pour la semaine."
      required: true
      selector: { number: { min: 0, step: 0.25, mode: box } }
    servings:
      name: Parts préparées
      description: Remplace le nombre de parts prévu au moment de poser le repas.
      selector: { number: { min: 0.25, step: 0.25, mode: box } }
    parts_total:
      name: Parts servies
      description: Combien de parts ont été servies à table, pour le partage.
      selector: { number: { min: 1, max: 24, mode: box } }
    parts_mine:
      name: Mes parts
      description: Combien de ces parts sont les miennes.
      selector: { number: { min: 0, max: 24, mode: box } }
    skip_ingredient_ids:
      name: Ingrédients à ne pas décrémenter
      description: >-
        Les lignes qu'on sort à la main ou qu'on n'utilise pas cette fois.
      selector: { object: }
    dry_run:
      name: Simuler seulement
      description: >-
        Coché, rien n'est écrit : le service rend le plan de décrément. C'est le
        comportement par défaut, pour qu'un premier appel exploratoire ne
        décrémente pas le garde-manger.
      default: true
      selector: { boolean: }

import_recipe:
  name: Importer une recette
  description: >-
    Importe une fiche depuis TheMealDB, par référence ou par recherche. Si un
    agent conversationnel est configuré, la recette est traduite et découpée en
    étapes ; sinon elle existe quand même, en anglais et marquée à relire.
  fields:
    source_ref:
      name: Référence de la source
      description: L'identifiant TheMealDB, par exemple 52772.
      selector: { text: }
    query:
      name: Recherche
      description: >-
        À défaut de référence, cherche et importe la première fiche trouvée.
      selector: { text: }

adapt_recipe:
  name: Adapter une recette importée
  description: >-
    Relance la traduction et le découpage en étapes d'une recette importée sans
    agent conversationnel. Sans effet sur les lignes déjà confirmées à la main.
  fields:
    recipe_id:
      name: Recette
      required: true
      selector: { number: { min: 1, mode: box } }

query_meals:
  name: Consulter le planning
  description: >-
    Ce qui est prévu sur une plage de journées alimentaires. Ne modifie rien.
  fields:
    start:
      name: Du
      description: Première journée alimentaire, au format AAAA-MM-JJ.
      required: true
      selector: { text: }
    end:
      name: Au
      description: Dernière journée alimentaire, incluse.
      required: true
      selector: { text: }
maintenance_plan:
  name: Plan de maintenance
  description: >-
    Rend les tâches d'entretien liées aux piles, fusionnées avec celles que le
    macro `maintenance.jinja` a déjà calculées. Personne n'appelle ce service à
    la main : il est appelé par l'automation « Maintenance - Synchronisation
    liste de tâches » (maintenance_sync_taches), qui s'en sert pour reconstruire
    todo.maintenance chaque heure. La réponse porte `items`, `keep` et
    `complete` — et c'est `complete` qui autorise ou non la fermeture des
    tâches : un plan incomplet a le droit d'ajouter et de rafraîchir, jamais de
    fermer.
  fields:
    extra_items:
      name: Tâches du macro
      description: >-
        Les items déjà calculés par le macro (aspirateurs, filtres, plantes,
        mises à jour). Recopiés tels quels, même ceux dont la forme n'est pas
        comprise : le service ne doit jamais pouvoir faire disparaître une tâche.
      required: false
      example: "{{ plan['items'] }}"
      selector:
        object:
    extra_keep:
      name: Résumés à maintenir
      description: >-
        Les résumés que le macro veut garder ouverts (son hystérésis). Réunis
        avec ceux des piles, sans doublon.
      required: false
      example: "{{ plan['keep'] }}"
      selector:
        object:

record_battery_event:
  name: Enregistrer un événement de pile
  description: >-
    Note qu'une pile vient d'être changée, rechargée, posée ou retirée. Un
    remplacement sort une rechange du placard quand la pile en a une, et remet
    à zéro le dernier relevé : on ne sait rien de la pile neuve tant que
    l'appareil n'a pas parlé.
  fields:
    battery_id:
      name: Pile
      description: Identifiant de la pile déclarée.
      required: true
      example: 7
      selector:
        number:
          min: 1
          mode: box
    kind:
      name: Nature de l'événement
      description: >-
        `replacement` (pile changée), `charge` (rechargée), `install` (posée
        pour la première fois) ou `removal` (retirée). Une pile jetable ne se
        recharge pas, une batterie intégrée ne se remplace pas.
      required: true
      example: replacement
      selector:
        select:
          options:
            - install
            - charge
            - replacement
            - removal
    occurred_at:
      name: Moment
      description: Horodatage ISO. Par défaut, maintenant.
      required: false
      example: "2026-08-21T10:00:00"
      selector:
        text:
    consume_spare:
      name: Sortir une rechange du placard
      description: >-
        Par défaut, une pile jetable en consomme une et une cellule
        rechargeable n'en consomme aucune — les quatre LADDA tournent entre le
        tiroir et trois capteurs, et compter chaque rotation viderait le stock
        pour rien. À forcer le jour où une cellule meurt vraiment.
      required: false
      example: true
      selector:
        boolean:
    note:
      name: Note
      description: Commentaire libre attaché à l'événement.
      required: false
      example: "achetée en lot de 4"
      selector:
        text:
    idempotency_key:
      name: Clé d'idempotence
      description: >-
        Rejouer la même clé ne réécrit ni l'événement ni la sortie de stock.
      required: false
      example: "b7e1-…"
      selector:
        text:

import_grocy_equipment:
  name: Importer les piles et équipements Grocy
  description: >-
    Reprend les piles, leurs rechanges et les équipements depuis une COPIE de
    grocy.db, puis balaye le registre pour proposer une décision sur chaque
    capteur de pile. Sans `apply`, rien n'est écrit : le rapport est rendu tel
    qu'un vrai passage le rendrait. À lire avant d'appliquer : `summary_diff`
    doit être vide et `ok` doit être vrai, sinon la bascule fermerait des
    tâches et en rouvrirait d'autres.
  fields:
    database_path:
      name: Chemin de la base Grocy
      description: >-
        Chemin d'une COPIE de grocy.db, lisible par Home Assistant. Jamais la
        base de production : l'import ne l'ouvre qu'en lecture seule, mais la
        copie reste la règle.
      required: true
      example: /config/grocy-copie.db
      selector:
        text:
    apply:
      name: Appliquer
      description: >-
        Faux par défaut. Vrai écrit réellement les produits, les piles et les
        équipements.
      required: false
      default: false
      selector:
        boolean:

# --- lot 4 : liste de courses, ticket, correction -----------------------------
# Ajoutées EN FIN, comme l'enregistrement dans `services.py` : ce fichier est
# allongé par un autre lot en parallèle.

add_to_shopping_list:
  name: Ajouter à la liste de courses
  description: >-
    Pose une ligne sur la liste, à la main. C'est la porte du vocal : un simple
    libellé suffit — « ajoute du beurre à la liste » — et la ligne survit à
    toutes les réconciliations, contrairement à celles que le robot pose.
  fields:
    product_id:
      name: Produit
      description: >-
        L'identifiant d'un produit du catalogue. Facultatif : sans lui, la ligne
        est un texte libre, ce qui est le cas normal quand on parle.
      required: false
      selector:
        number:
          min: 1
          mode: box
    free_text:
      name: Libellé
      description: >-
        Ce qu'on veut acheter, écrit tel quel. Ignoré si un produit est donné.
      required: false
      example: Piles télécommande salon
      selector:
        text:
    quantity:
      name: Quantité
      description: >-
        Dans l'unité de base du produit. Vide veut dire « ce qu'il faut », qui
        est une réponse valide — zéro n'en est pas une.
      required: false
      selector:
        number:
          min: 0.001
          max: 100000
          mode: box
    note:
      name: Note
      description: Une précision libre, affichée sous la ligne.
      required: false
      selector:
        text:

refresh_shopping_list:
  name: Réconcilier la liste de courses
  description: >-
    Recalcule la liste à partir des quatre origines : ruptures de stock, repas
    prévus, lignes posées à la main, achats récurrents. Tourne déjà toutes les
    quinze minutes ; ce service sert à ne pas attendre.
  fields:
    horizon_days:
      name: Jours de repas
      description: >-
        Combien de jours de repas prévus sont pris en compte. Sans valeur, celle
        des options est utilisée.
      required: false
      selector:
        number:
          min: 1
          max: 60
          mode: box

query_shopping_list:
  name: Lire la liste de courses
  description: >-
    Rend la liste ouverte, groupée par rayon, sans rien écrire ni créer
    d'entité. C'est ce que lit une réponse vocale à « qu'est-ce qu'il faut
    acheter ? ».
  fields:
    store_id:
      name: Magasin
      description: >-
        Trie la liste dans l'ordre appris de ce magasin. Sans lui, celui de la
        session ouverte, puis le dernier utilisé, puis l'ordre par défaut.
      required: false
      selector:
        number:
          min: 1
          mode: box

read_receipt:
  name: Lire un ticket de caisse
  description: >-
    Relance la lecture de la photo d'un ticket par l'entité `ai_task`
    configurée. Sans argument, reprend le dernier ticket en attente : c'est le
    geste du lendemain matin, quand le réseau du parking était mauvais.
  fields:
    receipt_id:
      name: Ticket
      description: L'identifiant du ticket. Sans lui, le dernier en attente.
      required: false
      selector:
        number:
          min: 1
          mode: box

correct_movement:
  name: Corriger une ligne du journal
  description: >-
    Écrit une contrepassation : une ligne DE PLUS, de motif identique et de
    signe inverse, reliée à celle qu'elle annule. Le journal n'est jamais
    réécrit, et le stock revient dans le lot d'origine. Un mouvement ne s'annule
    qu'une fois.
  fields:
    movement_id:
      name: Mouvement
      description: L'identifiant de la ligne du journal à annuler.
      required: true
      selector:
        number:
          min: 1
          mode: box

correct_meal:
  name: Annuler un repas validé
  description: >-
    Contrepasse le bloc entier d'un repas validé, dans l'ordre inverse : la part
    mangée, puis le plat, puis les ingrédients. Le repas repasse à « prévu ».
    Refusé si le plat a été entamé depuis — le passé n'est alors plus
    reconstituable.
  fields:
    meal_id:
      name: Repas
      description: L'identifiant du repas validé.
      required: true
      selector:
        number:
          min: 1
          mode: box
