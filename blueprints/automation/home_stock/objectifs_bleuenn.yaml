blueprint:
  name: Garde-manger — annonce des objectifs dépassés
  description: >-
    Chaque jour à l'heure choisie, fait annoncer par l'assistant conversationnel
    les objectifs nutritionnels dépassés — sur la journée en cours, et sur la
    moyenne des sept journées closes.

    Déclencheur horaire volontaire : un passage à `on` s'annoncerait au
    rafraîchissement du coordinateur, donc à n'importe quel quart d'heure, y
    compris à table. L'heure par défaut est 21 h 30 — après le dîner, dernier
    moment où la journée est encore corrigeable.

    Aucun capteur par nutriment n'est consulté : cinq des neuf capteurs
    quotidiens sont créés éteints, et `state()` y rendrait `unavailable`. Tout
    se lit dans l'attribut `exceeded` du capteur d'objectifs.

    Le texte remis à l'agent n'est pas une phrase : c'est le nom d'un
    événement suivi de ses données en JSON. Aucune langue n'y est imposée ;
    `language` n'est pas passé, donc Home Assistant transmet à l'agent la
    langue de l'instance, et c'est l'agent qui formule l'annonce dans cette
    langue.

    À importer une fois ; ce fichier n'est jamais installé par l'intégration.
  domain: automation
  input:
    heure:
      name: Heure de l'annonce
      default: "21:30:00"
      selector:
        time:
    agent:
      name: Agent conversationnel
      default: conversation.personas_studio_home_manager
      selector:
        entity:
          domain: conversation
    capteur:
      name: Capteur d'objectifs nutritionnels
      default: binary_sensor.home_stock_nutrition_goals
      selector:
        entity:
          domain: binary_sensor

triggers:
  - trigger: time
    at: !input heure

conditions:
  - condition: state
    entity_id: !input capteur
    state: "on"

variables:
  nom_capteur: !input capteur

actions:
  - action: conversation.process
    data:
      agent_id: !input agent
      # An event name followed by JSON data, never a sentence: the agent
      # phrases it in the language Home Assistant hands it (the instance's,
      # since `language` is not set). Nutrients are sent by their key
      # (`salt`, `kcal`, ...), scopes as `day` / `week`; the agent names them.
      text: >-
        {%- set ns = namespace(items=[]) %}
        {%- for d in state_attr(nom_capteur, 'exceeded') or [] %}
        {%- set ns.items = ns.items + [{'nutrient': d.nutrient,
                                        'scope': d.scope,
                                        'value': d.value | round(1),
                                        'goal': d.goal | round(1)}] %}
        {%- endfor -%}
        home_stock.nutrition_goals_exceeded {{ {'items': ns.items} | to_json }}
