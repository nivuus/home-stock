blueprint:
  name: Garde-manger — rappel de la liste de courses
  description: >-
    Chaque jour à l'heure choisie, fait annoncer par l'assistant conversationnel
    ce qu'il reste à acheter, groupé par rayon.

    Déclencheur horaire volontaire, comme pour les dates limites : le composant
    constate un changement au moment où son coordinateur se rafraîchit, parfois
    à trois heures du matin. Ce qu'un foyer veut, c'est « avant de partir,
    rappelle-moi ce qu'il faut ».

    L'annonce reste courte par construction : le compte, puis les rayons.
    Le détail des lignes n'est dit que si la liste tient dans « Détail jusqu'à »
    articles — au-delà, une énumération ne se retient pas et fait ignorer
    l'annonce entière.

    Le texte remis à l'agent n'est pas une phrase : c'est le nom d'un
    événement suivi de ses données en JSON. Aucune langue n'y est imposée ;
    `language` n'est pas passé, donc Home Assistant transmet à l'agent la
    langue de l'instance, et c'est l'agent qui formule l'annonce dans cette
    langue.

    À importer une fois ; ce fichier n'est jamais installé par l'intégration.
  domain: automation
  input:
    heure:
      name: Heure de l'annonce
      default: "18:00:00"
      selector:
        time:
    agent:
      name: Agent conversationnel
      default: conversation.personas_studio_home_manager
      selector:
        entity:
          domain: conversation
    capteur:
      name: Capteur de la liste de courses
      default: sensor.home_stock_shopping_list
      selector:
        entity:
          domain: sensor
    detail_max:
      name: Détail jusqu'à
      description: >-
        Nombre d'articles au-delà duquel l'annonce se contente du compte et des
        rayons, sans énumérer les lignes.
      default: 5
      selector:
        number:
          min: 0
          max: 30
          mode: box

triggers:
  - trigger: time
    at: !input heure

# Aucune ligne du tout : rien à annoncer, et le silence est ici la bonne
# réponse — c'est une annonce non sollicitée, pas une question posée.
conditions:
  - condition: numeric_state
    entity_id: !input capteur
    above: 0

# `!input capteur` ne s'interpole pas dans le Jinja ci-dessous : il doit passer
# par une variable nommée, sinon le texte lu ne voit aucune ligne — sans la
# moindre erreur. Piège déjà payé par `dlc_bleuenn.yaml`.
variables:
  nom_capteur: !input capteur
  detail_max: !input detail_max

actions:
  - action: conversation.process
    data:
      agent_id: !input agent
      # An event name followed by JSON data, never a sentence: the agent
      # phrases it in the language Home Assistant hands it (the instance's,
      # since `language` is not set). The leading name also keeps Home
      # Assistant from parsing the rendered text back into a dict.
      #
      # No `list.append`: Home Assistant's Jinja sandbox refuses it, and the
      # error only shows when the template RENDERS, i.e. in the evening, at
      # announcement time. Lists grow by concatenation on a namespace.
      text: >-
        {%- set lignes = (state_attr(nom_capteur, 'items') or [])
                         | rejectattr('checked') | list %}
        {%- set rayons = lignes | map(attribute='aisle')
                         | map('default', '', true) | list %}
        {%- set ns = namespace(aisles=[]) %}
        {%- for rayon in rayons | unique | list %}
        {%- set ns.aisles = ns.aisles + [{
              'aisle': rayon if rayon else none,
              'count': rayons | select('equalto', rayon) | list | count}] %}
        {%- endfor %}
        {%- set data = {'open_items': lignes | count, 'by_aisle': ns.aisles} %}
        {%- if lignes | count <= detail_max %}
        {%- set data = dict(data, items=lignes | map(attribute='name') | list) %}
        {%- endif -%}
        home_stock.shopping_reminder {{ data | to_json }}
