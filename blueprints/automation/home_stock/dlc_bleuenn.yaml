blueprint:
  name: Garde-manger — annonce des dates limites
  description: >-
    Chaque jour à l'heure choisie, fait annoncer par l'assistant conversationnel
    ce qui approche de sa date limite.

    Déclencheur horaire volontaire : le composant constate un basculement au
    moment où son coordinateur se rafraîchit, parfois à trois heures du matin.
    Ce qu'un foyer veut, c'est « chaque soir, dis-moi ce qui périme ».
    L'entité `event.home_stock_expiration` reste disponible pour qui préfère
    écrire une automation qui réagit à l'instant même.

    Le texte remis à l'agent n'est pas une phrase : c'est le nom d'un
    événement suivi de ses données en JSON. Aucune langue n'y est imposée ;
    `language` n'est pas passé, donc Home Assistant transmet à l'agent la
    langue de l'instance, et c'est l'agent qui formule l'annonce dans cette
    langue.

    À importer une fois ; ce fichier n'est jamais installé par l'intégration.
  domain: automation
  input:
    heure:
      name: Heure de l'annonce
      default: "18:00:00"
      selector:
        time:
    agent:
      name: Agent conversationnel
      default: conversation.personas_studio_home_manager
      selector:
        entity:
          domain: conversation
    capteur:
      name: Capteur de péremptions
      default: binary_sensor.home_stock_expirations
      selector:
        entity:
          domain: binary_sensor

triggers:
  - trigger: time
    at: !input heure

conditions:
  - condition: state
    entity_id: !input capteur
    state: "on"

variables:
  nom_capteur: !input capteur

actions:
  - action: conversation.process
    data:
      agent_id: !input agent
      # An event name followed by JSON data, never a sentence: the agent
      # phrases it in the language Home Assistant hands it (the instance's,
      # since `language` is not set). The leading name also keeps Home
      # Assistant from parsing the rendered text back into a dict.
      text: >-
        {%- set ns = namespace(items=[]) %}
        {%- for lot in state_attr(nom_capteur, 'batches') or [] %}
        {%- set ns.items = ns.items + [{'product': lot.product_name,
                                        'best_before': lot.best_before}] %}
        {%- endfor -%}
        home_stock.expiring_soon {{ {'items': ns.items} | to_json }}
