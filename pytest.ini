[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
markers =
    network: touche le réseau réel. Exclu par défaut, se lance à la main :
        ./scripts/test.sh -m network
# tests/test_install_hook.py et tests/test_manifest_contract.py sont les deux
# suites AUTONOMES du package (voir le Makefile : `make test`). Elles n'ont ni
# fonction de test ni fixture - elles s'executent a l'import, installent le
# package pour de vrai dans un repertoire temporaire et sortent en code 1 sur
# echec. Collectees par pytest, cela se produit pendant la COLLECTE : un
# sys.exit() y remonte en INTERNALERROR, et les imports que pytest a deja faits
# pour les 1382 autres tests ont pose un __pycache__ dans la source, ce que ces
# suites mesurent justement. Elles restent lancees par `make test`.
addopts = -m "not network"
    --ignore=tests/test_install_hook.py
    --ignore=tests/test_manifest_contract.py
