# Le corps des sept phrases du garde-manger : l'appel de service, et sa mise
# en phrase.
#
# LIVRÉ, JAMAIS INSTALLÉ. Coller ce bloc dans configuration.yaml, ou charger
# ce fichier comme paquet (`homeassistant: packages: !include_dir_named packages`).
# `intent_script` est une clé de configuration.yaml, un fichier que le
# propriétaire tient à la main : l'intégration n'y touche jamais.
#
# Deux règles de rédaction, reprises de `dlc_bleuenn.yaml` (lot 2) :
#   1. jamais une liste brute — « il te reste six œufs et un litre de lait »,
#      avec l'accord de nombre en Jinja ;
#   2. une phrase quand il n'y a rien — « il ne reste plus d'œufs » est une
#      réponse, le silence est une panne.
#
# LA REGLE QUI RELIE `action:` A `speech:` — corrigée le 2026-09-05, après que
# cinq des sept intents ont répondu « Une erreur est intervenue » en production.
# `response_variable:` posé sur un pas `- action:` range la réponse dans une
# variable LOCALE AU SCRIPT ; elle n'entre jamais dans la portée du gabarit
# `speech:`. `intent_script` ne lui offre qu'un seul nom, FIXE :
#
#     action_res = await action.async_run(slots, intent_obj.context)
#     if action_res and action_res.service_response is not None:
#         slots["action_response"] = action_res.service_response
#                                        (components/intent_script/__init__.py)
#
# et `service_response` n'est renseigné que si le script se termine par un pas
# `stop:` PORTEUR du `response_variable` — seule la branche `except _StopScript`
# de `helpers/script.py` alimente ce champ. Donc, pour tout intent qui parle de
# ce qu'un service lui a répondu, IL FAUT LES DEUX :
#
#     1. un `- stop: ""` final avec `response_variable:` ;
#     2. `action_response` dans le `speech:`, jamais le nom local.
#
# Écrire l'un sans l'autre rend `action_response` indéfini, et la mise en phrase
# échoue AU RENDU — au moment précis où quelqu'un parle. `tests/test_voice_package.py`
# tient désormais les deux moitiés de cette règle.
intent_script:

  # 1 — « Il me reste des œufs ? »
  HomeStockQueryStock:
    action:
      - action: home_stock.query_stock
        data:
          name: "{{ product }}"
        response_variable: reponse
      - stop: ""
        response_variable: reponse
    speech:
      text: >-
        {% set lignes = action_response.products | default([], true) %}
        {%- if lignes %}
        {#- Pas d'accumulateur : le bac à sable Jinja de Home Assistant refuse
            `list.append`, et l'erreur ne sort qu'au RENDU — donc au moment
            précis où quelqu'un parle. `loop.revindex == 2` place le « et »
            devant le dernier élément, sans liste intermédiaire. #}
        Il te reste {% for l in lignes %}{{ l.product_name }}, {{ l.display }}
        {%- if not loop.last %}{{ ' et ' if loop.revindex == 2 else ', ' }}{% endif %}
        {%- endfor %}.
        {%- else %}
        Il ne reste plus de {{ product }}.
        {%- endif %}

  # 2 — « Qu'est-ce qu'on mange ce soir ? »
  #
  # Le créneau est FACULTATIF : sans lui, la journée entière. D'où le
  # dictionnaire de charge construit en gabarit plutôt que deux appels dans un
  # `choose` — un `response_variable` posé dans une branche de `choose` serait
  # hors de portée du `stop:` final, et l'intent parlerait dans le vide.
  HomeStockQueryMeals:
    action:
      - variables:
          jour: "{{ now().date().isoformat() }}"
          creneau: "{{ slot | default('', true) }}"
      - action: home_stock.query_meals
        data: >-
          {{ {'start': jour, 'end': jour}
             | combine({'slot_key': creneau} if creneau else {}) }}
        response_variable: reponse
      - stop: ""
        response_variable: reponse
    speech:
      text: >-
        {% set repas = action_response.meals | default([], true) %}
        {%- if repas %}
        {{ 'Au menu' if repas | count > 1 else 'Il y a' }} :
        {% for r in repas %}{{ r.recipe_name or r.product_name or r.note }}
        {%- if not loop.last %}{{ ' et ' if loop.revindex == 2 else ', ' }}{% endif %}
        {%- endfor %}.
        {%- else %}
        Rien n'est prévu.
        {%- endif %}

  # 3 — « Qu'est-ce qu'il faut acheter ? »
  HomeStockQueryShoppingList:
    action:
      - action: home_stock.query_shopping_list
        response_variable: reponse
      - stop: ""
        response_variable: reponse
    speech:
      text: >-
        {#- `action_response['items']` et NON `action_response.items` : sur un
            dictionnaire, le point trouve d'abord la méthode `items()` de
            Python, et la mise en phrase échoue au rendu — au moment où
            quelqu'un parle. #}
        {% set rayons = action_response['items'] | default({}, true) %}
        {%- set total = action_response['count'] | default(0, true) %}
        {%- if total %}
        {{ total }} article{{ 's' if total > 1 else '' }} à acheter
        {%- for rayon, lignes in rayons.items() %}
        {{- (', dont ' if loop.first else ', ') ~ lignes | count
             ~ ' au rayon ' ~ rayon | lower }}
        {%- endfor %}.
        {%- else %}
        Il n'y a rien sur la liste de courses.
        {%- endif %}

  # 4 — « Ajoute du lait à la liste ». La seule écriture SANS confirmation :
  # l'effet tient en une ligne, et se répare en ne l'achetant pas.
  #
  # La quantité dite reste du TEXTE : « deux baguettes » n'est pas deux unités
  # de base, et convertir au jugé écrirait un chiffre que personne n'a dit.
  HomeStockAddToShoppingList:
    action:
      - action: home_stock.add_to_shopping_list
        data:
          free_text: >-
            {{ ((quantity ~ ' ') if quantity is defined and quantity else '') ~ product }}
        response_variable: reponse
      - stop: ""
        response_variable: reponse
    speech:
      text: >-
        {#- `default(true)` sans le drapeau booléen : `created` vaut FAUX
            quand la ligne existait déjà, et `default(x, true)` prendrait
            ce faux pour une absence.

            LA SECONDE BRANCHE EST INATTEIGNABLE PAR LA VOIX, ET ON LA GARDE.
            Mesuré le 2026-09-05 : `add_to_shopping_list` ne rend
            `created: false` que par deux chemins — un `product_id` dont la
            ligne est déjà ouverte (`open_item_for_product`), ou un
            `idempotency_key` déjà employé. Cet intent n'envoie que du
            `free_text`, donc `product_id` vaut None, donc `created` vaut
            TOUJOURS vrai ici : dire deux fois « note du lait » crée deux
            lignes. Les autres appelants, eux, atteignent bien ce cas —
            vérifié en appelant deux fois le service avec `product_id: 298` :
            `{item_id: 15, created: true}` puis `{item_id: 15, created: false}`,
            sans seconde ligne. La branche décrit donc un comportement RÉEL du
            service, pas une promesse morte : elle reste juste, et elle servira
            le jour où une phrase portera un produit du catalogue.

            Dédupliquer le texte libre (« lait » contre « du lait » contre
            « le lait ») n'est PAS la réponse et n'est pas engagé : c'est un
            terrier sans fond propre. #}
        {% if action_response.created | default(true) %}
        C'est noté, {{ product }} est sur la liste de courses.
        {%- else %}
        {{ product }} était déjà sur la liste.
        {%- endif %}

  # 5 — « Qu'est-ce qui périme ? » Aucun service : le capteur porte déjà le
  # détail, et une lecture d'attribut répond hors ligne.
  HomeStockQueryExpirations:
    speech:
      text: >-
        {% set lots = state_attr('binary_sensor.home_stock_expirations', 'batches')
                      or [] %}
        {%- if lots %}
        {{ lots | count }}
        {{- ' article approche de sa date limite' if lots | count == 1
            else ' articles approchent de leur date limite' }} :
        {{ lots | map(attribute='product_name') | join(', ') }}.
        {%- else %}
        Rien n'approche de sa date limite.
        {%- endif %}

  # 6 — « J'ai mangé le dîner », EN DEUX TOURS.
  #
  # Premier tour : `dry_run` vaut vrai, rien n'est décrémenté, Bleuenn énonce
  # le plan et demande confirmation. Second tour : la phrase « oui je
  # confirme » porte le slot fixe `confirm: yes` (voir
  # custom_sentences/fr/home_stock.yaml), `dry_run` tombe à faux, et l'écriture
  # a lieu. C'est le « deux appuis » de la tablette, transposé à l'oral — et
  # c'est le `dry_run: true` par défaut du lot 3 qui paie une seconde fois.
  #
  # La condition sur `repas` n'est pas décorative : sans repas planifié,
  # `meal_id` vaut None, et appeler le service produirait une erreur là où on
  # veut une phrase. Le script s'arrête, la mise en phrase le dit.
  HomeStockValidateMeal:
    action:
      - variables:
          repas: "{{ state_attr('sensor.home_stock_next_meal', 'meal_id') }}"
      - condition: template
        value_template: "{{ repas is not none }}"
      - action: home_stock.validate_meal
        data:
          meal_id: "{{ repas }}"
          portions_eaten: 1
          dry_run: "{{ confirm | default('', true) != 'yes' }}"
        response_variable: apercu
      - stop: ""
        response_variable: apercu
    speech:
      text: >-
        {#- Le `condition:` plus haut arrête le script SANS passer par le
            `stop:` : `action_response` reste alors indéfini, et cette première
            branche est la seule à répondre. C'est voulu — mais avant le
            2026-09-05 elle répondait TOUJOURS, y compris quand un repas
            existait, parce que le nom local `apercu` n'atteignait jamais le
            gabarit. Un faux négatif silencieux, pire qu'une erreur. #}
        {% if action_response is not defined or action_response is none %}
        Il n'y a aucun repas à valider pour le moment.
        {%- elif confirm | default('', true) == 'yes' %}
        C'est enregistré, le repas est validé.
        {%- else %}
        {%- set lignes = action_response.lines | default([], true) %}
        {%- if lignes %}
        Je retire {% for l in lignes %}{{ l.label }} de {{ l.product_name | lower }}
        {%- if not loop.last %}{{ ' et ' if loop.revindex == 2 else ', ' }}{% endif %}
        {%- endfor %}. Je confirme ?
        {%- else %}
        Il n'y a rien à retirer pour ce repas. Je confirme quand même ?
        {%- endif %}
        {%- endif %}

  # 7 — « Qu'est-ce que j'ai mangé aujourd'hui ? »
  HomeStockQueryToday:
    speech:
      text: >-
        {% set kcal = states('sensor.home_stock_kcal_today') | float(0) %}
        {%- set muets = state_attr('sensor.home_stock_kcal_today',
                                   'unvalued_movements') | int(0) %}
        {%- if kcal > 0 %}
        Aujourd'hui, tu as mangé {{ kcal | round | int }} kilocalories
        {%- if muets %}, et {{ muets }} mouvement{{ 's' if muets > 1 else '' }}
        {{- ' sans valeur nutritionnelle' }}{% endif %}.
        {%- else %}
        Rien n'a encore été enregistré aujourd'hui.
        {%- endif %}
